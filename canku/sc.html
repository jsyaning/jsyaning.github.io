<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频播放</title>
    <style>
        /* 使视频居中显示 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        video {
            width: 80%; /* 视频宽度为视窗的80% */
            max-width: 800px; /* 最大宽度为800px */
            height: auto; /* 自动调整高度 */
            border-radius: 8px; /* 圆角边框 */
        }
    </style>
</head>
<body>

    <video autoplay loop muted>
        <source src="https://jsyaning-github-io.pages.dev/mp4/dy.mp4" type="video/mp4">
    </video>

</body>
</html>
